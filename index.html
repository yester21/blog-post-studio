<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>블로그 포스트 스튜디오 — WordPress 발행 패키지 제작기</title>
  <meta name="description" content="키워드·아웃라인·본문·SEO를 정리해 WordPress 발행 패키지(HTML/MD/ZIP)로 내보내는 웹 도구">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071e3'/%3E%3Cpath d='M9 10h14M9 14h14M9 18h9' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M9 23h6' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="brand">
        <span class="brand-dot">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"><path d="M5 7h14M5 11h14M5 15h8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M5 19h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <div class="brand-text">
          <strong>블로그 포스트 스튜디오</strong>
          <small>WordPress 발행 패키지 · 카드뉴스 스튜디오 세트</small>
        </div>
      </div>
      <input id="post-title" class="project-title" spellcheck="false" placeholder="글 제목" title="글 제목" aria-label="글 제목">
      <div class="header-actions">
        <button id="btn-settings" class="btn btn-text" title="키워드·톤·길이·링크·메타 설정">글 설정</button>
        <button id="btn-ai" class="btn btn-text" title="AI 프롬프트로 초안 만들기">AI 초안</button>
        <button id="btn-cardnews" class="btn btn-text" title="이 포스트로 카드뉴스 초안 만들기">카드뉴스로 →</button>
        <span class="v-divider"></span>
        <button id="btn-copy-html" class="btn btn-text" title="WordPress 코드 에디터에 붙여넣을 본문 HTML 복사">HTML 복사</button>
        <button id="btn-md" class="btn btn-text" title="Markdown 파일 저장">MD 저장</button>
        <button id="btn-zip" class="btn btn-primary" title="post.html + post.md + meta.json + images를 ZIP으로">전체 ZIP 다운로드</button>
      </div>
    </header>
    <div id="app-main">
      <aside id="outline-rail" aria-label="아웃라인"></aside>
      <main id="preview-pane">
        <div id="score-head" aria-label="온페이지 준비도"></div>
        <div id="article-scroll">
          <article id="article-preview" class="article"></article>
        </div>
        <div id="qa-strip" aria-live="polite"></div>
      </main>
      <aside id="editor-pane" aria-label="섹션 편집"></aside>
    </div>
  </div>
  <div id="toast-area"></div>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js?v=b2"></script>
</body>
</html>
